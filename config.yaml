# Порядок = приоритет: если монета есть на нескольких биржах, берётся первая
exchanges: [binance, bybit, okx]
timeframe: 1d          # основной ТФ идей (1d, 4h)
history_bars: 365      # глубина истории для анализа и графика

universe:
  min_quote_volume_usd: 20000000   # объём за 24ч, USDT-перпетуалы
  max_symbols: 150
  exclude_bases: [USDC, FDUSD, TUSD, USDP, DAI, BUSD, EUR, AEUR]

strategy:
  max_distance_pct: 10     # цена не дальше N% от ближней границы зоны
  zone_tol_atr: 1.0        # допуск кластеризации swing-уровней (в ATR)
  zone_min_touches: 2
  zone_min_height_pct: 8   # минимальная толщина зоны на графике
  pools_count: 2           # сколько пулов ликвидности брать целями
  min_rr: 2.0              # R/R до последней цели от консервативного входа
  min_score: 55            # порог скоринга 0..100

schedule:
  scan_interval_minutes: 240
  track_interval_minutes: 15
  max_ideas_per_day: 3
  cooldown_days: 7         # не повторять монету N дней после закрытия идеи
  max_wait_days: 10        # идея отменяется, если пробоя нет за N дней
  weekly_report_weekday: mon
  weekly_report_hour_utc: 9

risk:
  risk_per_trade_pct: 1.0

caption:
  disclaimer: false

chart:
  mascot_image: assets/mascot.png   # талисман слева сверху; null — выключить
  watermark_text: ""
  watermark_image: null    # маленький логотип слева внизу (PNG)

morning:
  enabled: true
  hour_msk: 9              # утренний пост, время по Москве (UTC+3)
  reveal_hour_msk: 12      # когда раскрывать «монету дня» из утреннего тизера
  audience: [Прайд, львы, ребята, команда, народ]
  news_feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed

stickers:
  enabled: true            # стикеры из присланных вами паков, по ситуации
  chance:                  # вероятность стикера в каждой ситуации (0..1)
    morning: 0.8           # утренний пост
    profit: 0.8            # цель взята
    celebrate: 1.0         # все цели закрыты
    loss: 0.5              # стоп
    shrug: 0.3             # идея отменена / неактуальна
    hype: 0.6              # пробой уровня
    laugh: 0.5             # мем и шутка
    think: 0.4             # факт
    bullish: 0.25          # новый сигнал LONG
    bearish: 0.25          # новый сигнал SHORT

fun:
  enabled: true            # мемы, факты и шутки между сделками
  model: claude-sonnet-5-5 # лёгкая творческая задача: Sonnet дешевле Opus
  memes_dir: assets/memes  # свои картинки-мемы (jpg/png/webp), бот подпишет и выложит
  trends: true             # раз в сутки искать актуальные мемы и тренды (Claude с веб-поиском, иначе лента Google Trends)
  topics:                  # любимые темы автора: вдохновение для мемов и шуток
    - "Мелстрой: казино-стримы как мем про азарт трейдера (без выдуманных фактов и цитат о нём)"
    - "популярные тикток-тренды и мем-форматы, если они безобидные"
  slots:                   # время по Москве; kind: meme | fact | joke | mix (мем или шутка)
    - {time_msk: "13:00", kind: meme}
    - {time_msk: "17:30", kind: fact}
    - {time_msk: "21:00", kind: mix}

writer:
  enabled: true            # тексты постов пишет Claude (нужен секрет ANTHROPIC_API_KEY); без ключа — шаблоны
  model: claude-opus-5-5
  effort: low

context:
  enabled: true            # funding, открытый интерес, тренд BTC, Fear & Greed

db_path: data/signalbot.sqlite3
